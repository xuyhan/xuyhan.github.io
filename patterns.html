<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Patterns · Han Xuanyuan</title>
  <meta name="author" content="Han Xuanyuan">
  <meta name="description" content="Mathematical sketches made from simple rules drawn slowly by the page.">

  <link rel="canonical" href="https://han.wales/patterns.html">

  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex-swap.min.css" integrity="sha384-ZLYhxmRv7L3uIzPeM2/QcB1VDGw0KWFqt0YK5lX+8+ju3nl/Dx+HV5dl06SUiJ6E" crossorigin="anonymous">
  <link rel="stylesheet" href="stylesheet.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.js" integrity="sha384-AtrdNsnxl/75rvBneBVH7DtOvCxSVahR2zWqle1coBKd8DEmLoviqNeJSx64gNAs" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/contrib/auto-render.min.js" integrity="sha384-bjyGPfbij8/NDKJhSGZNP/khQVgtHUE5exjm4Ydllo42FwIgYsdLO2lXGmRBf5Mz" crossorigin="anonymous" onload="renderMathInElement(document.querySelector('.patterns'), { delimiters: [{ left: '\\(', right: '\\)', display: false }], throwOnError: false });"></script>
  <script>
    // Apply a saved theme choice before paint (no flash). No choice → follows the OS.
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>

<body>
<button id="theme-toggle" type="button" aria-label="Switch between light and dark theme" title="Light / dark">
  <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
</button>
<main class="container patterns">

  <header class="patterns-head">
    <p class="crumb"><a href="index.html">Han Xuanyuan</a></p>
    <h1 class="patterns-title">Patterns</h1>
    <p class="patterns-note">Five studies of simple rules, drawn slowly by the page. Give them a minute.</p>
  </header>

  <figure class="piece">
    <canvas id="phyllotaxis" role="img" aria-label="A phyllotaxis spiral of dots, appearing one by one from the centre"></canvas>
    <figcaption>
      <span class="piece-title">Order without intention</span>
      <span class="piece-math">phyllotaxis from repeated turns through the golden angle: <span class="math math-nowrap">\(\theta = n \cdot 137.5\ldots^\circ,\; r \propto \sqrt{n}\)</span></span>
    </figcaption>
  </figure>

  <figure class="piece">
    <canvas id="harmonograph" role="img" aria-label="A damped Lissajous curve tracing itself in a fine line"></canvas>
    <figcaption>
      <span class="piece-title">Almost in agreement</span>
      <span class="piece-math">a damped Lissajous curve traced by two oscillations whose frequencies form a small ratio <span class="math">\(p:q\)</span> and drift slightly out of tune: <span class="math">\(x = e^{-\delta t}\sin(pt + \varphi),\; y = e^{-\varepsilon t}\sin(qt + \psi)\)</span></span>
    </figcaption>
  </figure>

  <figure class="piece">
    <canvas id="voxels" role="img" aria-label="A fractal crystal of cubes growing block by block from a single seed"></canvas>
    <figcaption>
      <span class="piece-title">Built without a builder</span>
      <span class="piece-math">a cellular automaton grown for thirteen generations from a single seed; a block appears wherever exactly one of its six neighbours is occupied</span>
    </figcaption>
  </figure>

  <figure class="piece">
    <canvas id="clifford" role="img" aria-label="A Clifford attractor accumulating from hundreds of thousands of plotted points"></canvas>
    <figcaption>
      <span class="piece-title">The shape of its habits</span>
      <span class="piece-math">a Clifford attractor formed by iterating a single orbit for a few hundred thousand steps: <span class="math">\(x' = \sin(ay) + c\cos(ax),\; y' = \sin(bx) + d\cos(by)\)</span></span>
    </figcaption>
  </figure>

  <!-- Archived terrain comparisons, preserved for possible return:
  <figure class="piece">
    <canvas id="terrain" role="img" aria-label="An island map emerging from broad land masses into increasingly detailed coastlines"></canvas>
    <figcaption>
      <span class="piece-title">The coast, reconsidered</span>
      <span class="piece-math">fractal terrain in which sea level cuts a world from noise, refining broad forms into fine coastlines: <span class="math">\(h(x,y) = \sum_k 2^{-k} n(2^k x, 2^k y)\)</span></span>
    </figcaption>
  </figure>

  <figure class="piece">
    <canvas id="heightmap" role="img" aria-label="A spherical Perlin-noise planet refining from broad continents into detailed coasts and islands"></canvas>
    <figcaption>
      <span class="piece-title">A world in octaves</span>
      <span class="piece-math">Perlin fractal Brownian motion on a sphere, built from seven octaves of three-dimensional gradient noise; sea level reveals continents and islands: <span class="math">\(h(\mathbf{s}) = \sum_{k=0}^{6} 2^{-k} P(2^k\mathbf{s}),\; \mathbf{s} \in S^2\)</span></span>
    </figcaption>
  </figure>
  -->

  <figure class="piece">
    <div class="globe-stage">
      <canvas id="globe" role="img" aria-label="A rotating three-dimensional planet whose continents and islands form from Perlin-noise octaves"></canvas>
      <canvas id="globe-webgl" aria-hidden="true"></canvas>
    </div>
    <figcaption>
      <span class="piece-title">A world in octaves</span>
      <span class="piece-math">fractal Brownian motion on a rotating sphere, where broad continents emerge first and finer octaves of three-dimensional gradient noise add coastlines and islands: <span class="math">\(h(\mathbf{s}) = \sum_{k=0}^{6} 0.55^k P_k(1.35 \cdot 2^k\mathbf{s}),\; \mathbf{s} \in S^2\)</span></span>
    </figcaption>
  </figure>

  <!-- Tesseract preserved for possible return:
  <figure class="piece">
    <canvas id="tesseract" role="img" aria-label="A wireframe tesseract turning slowly"></canvas>
    <figcaption>
      <span class="piece-title">Seen only in projection</span>
      <span class="piece-math">a tesseract turning in two planes of <span class="math">\(\mathbb{R}^4\)</span> at once, cast down to the page</span>
    </figcaption>
  </figure>
  -->

  <footer>
    <p>© <span id="year">2026</span> Han Xuanyuan &nbsp;·&nbsp; Built with plain HTML/CSS &nbsp;·&nbsp; <a href="https://github.com/xuyhan/xuyhan.github.io">Source</a></p>
  </footer>

</main>

<script src="script.js"></script>
<script src="patterns.js"></script>
<script>
  // Theme toggle. Default follows the OS; a click overrides it and persists.
  (function () {
    var root = document.documentElement;
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    function effective() { return root.getAttribute('data-theme') || (mq.matches ? 'dark' : 'light'); }
    function paintIcon() { btn.setAttribute('data-effective', effective()); }
    btn.addEventListener('click', function () {
      var next = effective() === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
      paintIcon();
    });
    if (mq.addEventListener) mq.addEventListener('change', paintIcon);
    paintIcon();
  })();
</script>
</body>
</html>
